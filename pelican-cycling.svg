<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">骑自行车的鹈鹕 · Pelican Pedal Club</title>
  <desc id="description">一只戴着绿色骑行帽、系着橘红围巾的白色鹈鹕，在海边悠闲地骑一辆绿色自行车。车轮持续转动，两只蹼足交替踩踏，围巾随风飘动。独立 SVG 循环动画，无需脚本或外部资源。</desc>
  <!-- All motion is native SVG SMIL. Pedals and legs share a 1.4 s cycle. -->
  <defs>
    <clipPath id="canvas-clip"><rect width="960" height="720" rx="28"/></clipPath>
    <clipPath id="road-clip"><rect x="0" y="595" width="960" height="54"/></clipPath>
    <pattern id="paper-grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".7" fill="#294B46" opacity=".065"/>
      <circle cx="18" cy="15" r=".65" fill="#294B46" opacity=".045"/>
    </pattern>
  </defs>

  <g clip-path="url(#canvas-clip)">
